trigger:
  branches:
    include:
      - main
      - features

pool:
  name: deepu

variables:
  terraformVersion: '1.7.0'
  terraformWorkingDirectory: '$(Build.SourcesDirectory)'

  azureServiceConnection: 'azure-service-connection'

  backendResourceGroup: 'cicd_test'
  backendStorageAccount: 'storagecicd12'
  backendContainer: 'cicdcontainer'
  backendKey: 'terraform.tfstate'

  azureOpenAIDeployment: 'gpt-4.1'

stages:

# ============================================================
# STAGE 1
# TERRAFORM PLAN + SECURITY
# ============================================================

- stage: Terraform_Plan
  displayName: 'Terraform Plan & Security'

  jobs:
  - job: Plan
    displayName: 'Terraform Plan'

    steps:

    - checkout: self
      clean: true

    # --------------------------------------------------------
    # Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: PowerShell@2
      displayName: 'Verify Terraform'
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "Agent"
          Write-Host "======================================"

          Write-Host "OS: $env:AGENT_OS"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Agent: $env:AGENT_NAME"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "Terraform"
          Write-Host "======================================"

          terraform version

          Write-Host ""
          Write-Host "Terraform location:"

          Get-Command terraform

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'

    # --------------------------------------------------------
    # Format
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Terraform Format Check'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(terraformWorkingDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          terraform fmt -check -recursive

    # --------------------------------------------------------
    # Validate
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'

    # --------------------------------------------------------
    # Checkov
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Install Checkov'
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"

          python3 -m pip install --user checkov

          Write-Host "Checkov installed."

    - task: PowerShell@2
      displayName: 'Terraform Security Scan'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(terraformWorkingDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "Checkov Security Scan"
          Write-Host "======================================"

          checkov `
            -d . `
            --framework terraform `
            --output json `
            --output-file-path console,checkov-report.json

    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-out=tfplan'

    # --------------------------------------------------------
    # Plan JSON
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Create Terraform Plan JSON'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(terraformWorkingDirectory)'
        script: |
          $ErrorActionPreference = "Stop"

          terraform show -json tfplan > tfplan.json

          if (!(Test-Path "tfplan.json")) {
              throw "tfplan.json was not generated."
          }

    # --------------------------------------------------------
    # Publish artifacts
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(terraformWorkingDirectory)/tfplan'
        artifact: 'terraform-plan'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan JSON'
      inputs:
        targetPath: '$(terraformWorkingDirectory)/tfplan.json'
        artifact: 'terraform-plan-json'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Checkov Report'
      inputs:
        targetPath: '$(terraformWorkingDirectory)/checkov-report.json'
        artifact: 'security-report'


# ============================================================
# STAGE 2
# AGENTIC AI SECURITY REVIEW
# ============================================================

- stage: Agentic_AI
  displayName: 'Agentic AI Security Review'

  dependsOn: Terraform_Plan
  condition: succeeded()

  jobs:
  - job: AIReview
    displayName: 'AI Terraform Security Agent'

    steps:

    - download: current
      artifact: terraform-plan-json

    - download: current
      artifact: security-report

    - task: PowerShell@2
      displayName: 'Install AI SDK'
      inputs:
        targetType: 'inline'
        script: |
          $ErrorActionPreference = "Stop"

          python3 -m pip install --user openai

    # --------------------------------------------------------
    # ACTUAL AI SECURITY ANALYSIS
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: 'Run Agentic AI'
      env:
        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
        AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)

      inputs:
        targetType: 'inline'

        script: |

          $ErrorActionPreference = "Stop"

          $env:PLAN_FILE = "$(Pipeline.Workspace)/terraform-plan-json/tfplan.json"
          $env:SECURITY_FILE = "$(Pipeline.Workspace)/security-report/checkov-report.json"
          $env:OPENAI_DEPLOYMENT = "$(azureOpenAIDeployment)"

          @'
          import os
          import json
          from openai import AzureOpenAI

          PLAN_FILE = os.environ["PLAN_FILE"]
          SECURITY_FILE = os.environ["SECURITY_FILE"]

          # ==================================================
          # READ-ONLY SECURITY TOOLS
          # ==================================================

          def read_plan():
              with open(PLAN_FILE, "r") as f:
                  return json.load(f)

          def read_security_report():
              with open(SECURITY_FILE, "r") as f:
                  return json.load(f)

          def summarize_plan(plan):

              summary = {
                  "create": 0,
                  "update": 0,
                  "delete": 0,
                  "replace": 0
              }

              for resource in plan.get("resource_changes", []):

                  actions = resource.get(
                      "change", {}
                  ).get("actions", [])

                  if actions == ["create"]:
                      summary["create"] += 1

                  elif actions == ["update"]:
                      summary["update"] += 1

                  elif actions == ["delete"]:
                      summary["delete"] += 1

                  elif "create" in actions and "delete" in actions:
                      summary["replace"] += 1

              return summary

          plan = read_plan()
          security = read_security_report()

          summary = summarize_plan(plan)

          # ==================================================
          # AI
          # ==================================================

          client = AzureOpenAI(
              api_key=os.environ["AZURE_OPENAI_API_KEY"],
              azure_endpoint=os.environ["AZURE_OPENAI_ENDPOINT"],
              api_version="2024-10-21"
          )

          system_prompt = """
          You are an Agentic AI Terraform Security Engineer.

          You are READ ONLY.

          Analyze:
          - Terraform plan
          - Terraform resource changes
          - Checkov findings
          - Azure security risks
          - RBAC changes
          - Network exposure
          - Public resources
          - Encryption configuration
          - Secret exposure

          SECURITY RULES:

          NEVER:
          - run terraform apply
          - run terraform destroy
          - modify Azure
          - read secrets
          - modify RBAC
          - execute shell commands
          - bypass human approval

          A human MUST approve Terraform Apply.

          Risk policy:

          CRITICAL = BLOCK
          HIGH     = REVIEW
          MEDIUM   = REVIEW
          LOW      = APPROVE

          Return JSON only:

          {
            "risk": "LOW|MEDIUM|HIGH|CRITICAL",
            "recommendation": "APPROVE|REVIEW|BLOCK",
            "create": 0,
            "update": 0,
            "delete": 0,
            "replace": 0,
            "security_findings": [],
            "reason": ""
          }
          """

          input_data = {
              "terraform_summary": summary,
              "terraform_plan": plan,
              "security_report": security
          }

          response = client.chat.completions.create(
              model=os.environ["OPENAI_DEPLOYMENT"],
              temperature=0,
              response_format={"type": "json_object"},
              messages=[
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": json.dumps(input_data)[:180000]
                  }
              ]
          )

          result = response.choices[0].message.content

          review = json.loads(result)

          print("")
          print("======================================")
          print("AGENTIC AI SECURITY RESULT")
          print("======================================")
          print(json.dumps(review, indent=2))

          with open("ai-review.json", "w") as f:
              json.dump(review, f, indent=2)

          risk = review.get("risk", "CRITICAL")
          recommendation = review.get(
              "recommendation",
              "BLOCK"
          )

          if risk == "CRITICAL":
              print("CRITICAL risk detected.")
              raise SystemExit(1)

          if recommendation == "BLOCK":
              print("AI recommends BLOCK.")
              raise SystemExit(1)

          if risk == "HIGH":
              print("WARNING: HIGH risk. Human approval required.")

          print("AI security review passed.")


          python3 agent.py

    - task: PublishPipelineArtifact@1
      displayName: 'Publish AI Report'
      inputs:
        targetPath: 'ai-review.json'
        artifact: 'ai-review'


# ============================================================
# STAGE 3
# HUMAN APPROVAL
# ============================================================

- stage: Terraform_Approval
  displayName: 'Human Approval'

  dependsOn:
  - Terraform_Plan
  - Agentic_AI

  condition: |
    and(
      succeeded('Terraform_Plan'),
      succeeded('Agentic_AI')
    )

  jobs:

  - deployment: TerraformApproval
    displayName: 'Approve Terraform Apply'

    environment: 'terraform-approval'

    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "======================================"
              echo "Terraform Apply Approval"
              echo "======================================"
              echo "AI security review passed."
              echo "Human approval is required."
            displayName: 'Approval Gate'


# ============================================================
# STAGE 4
# TERRAFORM APPLY
# ============================================================

- stage: Terraform_Apply
  displayName: 'Terraform Apply'

  dependsOn: Terraform_Approval
  condition: succeeded()

  jobs:

  - job: Apply
    displayName: 'Terraform Apply'

    steps:

    - checkout: self
      clean: true

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'

    - task: TerraformTask@5
      displayName: 'Terraform Apply'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-auto-approve'